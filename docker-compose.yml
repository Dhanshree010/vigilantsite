version: '3.8'

services:
  # Backend API & WebSocket Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: visionops-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost
      - JWT_SECRET=visionops_production_super_secret_key_2026
      - MONGO_URI=mongodb://mongo:27017/visionops
      - ALERT_DEBOUNCE_SECONDS=5
    depends_on:
      - mongo

  # Frontend Web Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: visionops-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

  # MongoDB Database (Optional persistent store)
  mongo:
    image: mongo:6.0
    container_name: visionops-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
