name: VisionOps Integration & Deployment Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-backend:
    name: Backend Validation (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package.json

      - name: Install Dependencies
        run: |
          cd server
          npm ci || npm install

      - name: Run Backend Syntax & Lint Check
        run: |
          cd server
          node -c src/server.js
          node -c src/app.js

  validate-frontend:
    name: Frontend Build Validation (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package.json

      - name: Install Dependencies & Build
        run: |
          cd client
          npm ci || npm install
          npm run build

  validate-edge-python:
    name: Edge ML Pipeline Validation (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Validate Edge Syntax
        run: |
          flake8 edge-ai/ --count --select=E9,F63,F7,F82 --show-source --statistics
